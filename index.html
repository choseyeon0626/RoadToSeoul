<!DOCTYPE html>
<html lang="ko">

    <button class="sidebar__toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span>메뉴</span>
    </button>
    <nav class="sidebar__nav" id="site-nav" aria-label="주요 메뉴">
      <a class="sidebar__link" href="era.html?era=three-kingdoms" data-era="three-kingdoms" style="--era:#C99A3E">

    <section class="hero" id="hero" data-theme="light">

          <img src="img/logo-gilgi.png" width="110" height="143" alt="길記 in Seoul">
